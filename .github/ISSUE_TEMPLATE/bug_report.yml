name: Bug report
description: Report something in Prism that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include secrets, recovery phrases, invite links, sync tokens, or private relay credentials.

        If this is a security issue, stop here and email security@prismplural.com instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: I expected..., but...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect your use of Prism?
      placeholder: This blocks me from..., or this is a minor annoyance because...
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did you see the bug?
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Linux
        - Windows
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prism version
      description: Include the version, commit, or build number if you know it.
      placeholder: "0.12.2, main at abc1234, or unknown"
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, or logs
      description: Add anything that helps explain the problem. Please remove private data first.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else maintainers should know?
    validations:
      required: false
