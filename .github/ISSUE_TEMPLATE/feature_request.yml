name: Feature request
description: Suggest a new capability or behavior change for Prism.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. For larger changes, an issue is the right place to align on product behavior before code is written.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: I want to..., but currently...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Prism do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but useful when there are multiple possible designs.
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Is this platform-specific?
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Linux
        - Windows
        - All supported platforms
        - Not sure
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, sketches, examples from other tools, or related issues.
    validations:
      required: false
