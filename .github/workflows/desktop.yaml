name: Desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Release tag to attach artifacts to (optional)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtk-3-dev clang cmake pkg-config \
            libsecret-1-dev libjsoncpp-dev libsqlite3-dev \
            libasound2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cargokit

      - run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package tarball
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          bundle=build/linux/x64/release/bundle
          # Wrapper script: forces XWayland to match packaging/linux/README.md.
          cat > "$bundle/prism" <<'WRAPPER'
          #!/bin/sh
          DIR="$(dirname "$(readlink -f "$0")")"
          export GDK_BACKEND=x11
          exec "$DIR/prism_plurality" "$@"
          WRAPPER
          chmod +x "$bundle/prism"
          mkdir -p dist
          tar -C "$bundle" -czf "dist/Prism-${version}-linux-x64.tar.gz" .
          (cd dist && sha256sum "Prism-${version}-linux-x64.tar.gz" > "Prism-${version}-linux-x64.tar.gz.sha256")
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.attach_to_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.attach_to_release || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Enable Windows developer mode
        # Lets Flutter create real symlinks in .plugin_symlinks/ during pub get.
        # Without this, Flutter falls back to copying and cargokit's relative
        # ../../../../crates/prism-sync-ffi path escapes the plugin dir into
        # the local filesystem instead of resolving through the symlink to the
        # pub-cache prism-sync checkout, so Cargo.toml is not found.
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargokit

      - run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $bundle  = 'build\windows\x64\runner\Release'
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist\Prism-$version-windows-x64.zip"
          Compress-Archive -Path "$bundle\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "$zip.sha256"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.attach_to_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.attach_to_release || github.ref_name }}
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
