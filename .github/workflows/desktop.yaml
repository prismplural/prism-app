name: Desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Release tag to attach artifacts to (optional)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtk-3-dev clang cmake pkg-config \
            libsecret-1-dev libsqlite3-dev \
            libasound2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cargokit

      - run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Check desktop branding
        run: dart run tool/desktop_branding.dart check

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package tarball
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          bundle=build/linux/x64/release/bundle
          # Wrapper script: forces XWayland to match packaging/linux/README.md.
          cat > "$bundle/prism" <<'WRAPPER'
          #!/bin/sh
          DIR="$(dirname "$(readlink -f "$0")")"
          export GDK_BACKEND=x11
          if [ -n "${XDG_DATA_DIRS:-}" ]; then
            export XDG_DATA_DIRS="$DIR/share:$XDG_DATA_DIRS"
          else
            export XDG_DATA_DIRS="$DIR/share:/usr/local/share:/usr/share"
          fi
          exec "$DIR/prism_plurality" "$@"
          WRAPPER
          chmod +x "$bundle/prism"
          mkdir -p "$bundle/share/applications" "$bundle/share/metainfo" "$bundle/share/icons"
          cp packaging/linux/com.prismplural.prism.desktop "$bundle/share/applications/"
          cp packaging/linux/com.prismplural.prism.metainfo.xml "$bundle/share/metainfo/"
          cp -R packaging/linux/icons/hicolor "$bundle/share/icons/"
          mkdir -p dist
          tar -C "$bundle" -czf "dist/Prism-${version}-linux-x64.tar.gz" .
          (cd dist && sha256sum "Prism-${version}-linux-x64.tar.gz" > "Prism-${version}-linux-x64.tar.gz.sha256")
          ls -la dist/

      - name: Package Debian artifact
        run: scripts/package_linux_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.attach_to_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.attach_to_release || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          fail_on_unmatched_files: true

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Exclude workspace from Windows Defender
        # Defender real-time scanning on GHA runners can briefly lock freshly
        # written files during heavy I/O (cargo's output), surfacing as
        # paradoxical "cannot find ... File exists" errors from later steps.
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Pub\Cache" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargokit

      - run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Check desktop branding
        run: dart run tool/desktop_branding.dart check

      - name: Stage prism-sync crates for cargokit
        # Cargokit resolves this path lexically on Windows; point it at the
        # same prism-sync checkout selected by pub get.
        shell: pwsh
        run: |
          $packageConfig = Get-Content '.dart_tool\package_config.json' -Raw | ConvertFrom-Json
          $syncPackage = $packageConfig.packages |
            Where-Object { $_.name -eq 'prism_sync' } |
            Select-Object -First 1
          if (-not $syncPackage) {
            throw 'prism_sync not found in package_config.json'
          }

          $rootUri = [string]$syncPackage.rootUri
          $syncRoot = if ($rootUri.StartsWith('file:')) {
            ([System.Uri]$rootUri).LocalPath
          } else {
            Resolve-Path (Join-Path '.dart_tool' $rootUri)
          }

          $syncCheckout = Get-Item -LiteralPath $syncRoot
          while ($syncCheckout -and -not (Test-Path (Join-Path $syncCheckout.FullName 'crates\prism-sync-ffi\Cargo.toml'))) {
            $syncCheckout = $syncCheckout.Parent
          }
          if (-not $syncCheckout) {
            throw "prism-sync checkout not found from package root $syncRoot"
          }

          $cratesSrc = Join-Path $syncCheckout.FullName 'crates'
          $cratesDst = 'windows\flutter\crates'
          New-Item -ItemType Directory -Force -Path 'windows\flutter' | Out-Null
          if (Test-Path -LiteralPath $cratesDst) {
            $existing = Get-Item -LiteralPath $cratesDst -Force
            if ($existing.LinkType -eq 'Junction') {
              cmd /c "rmdir `"$cratesDst`""
            } else {
              Remove-Item -LiteralPath $cratesDst -Recurse -Force
            }
          }
          Write-Host "Using prism-sync crates from $cratesSrc"
          cmd /c "mklink /J `"$cratesDst`" `"$cratesSrc`""

      - name: Build Windows release
        env:
          # CMake forwards verbose output to MSBuild, which otherwise swallows
          # cargokit/cargo stderr behind a bare MSB8066 "exited with code -1".
          VERBOSE: '1'
        run: flutter build windows --release --verbose

      - name: Diagnose prism_sync.dll on failure
        if: failure()
        shell: pwsh
        run: |
          $paths = @(
            'build\windows\x64\plugins\prism_sync\Release',
            'build\windows\x64\plugins\prism_sync\Release\prism_sync.dll',
            'build\windows\x64\plugins\prism_sync'
          )
          foreach ($p in $paths) {
            Write-Host "=== $p ==="
            if (Test-Path -LiteralPath $p) {
              Get-Item -LiteralPath $p -Force | Format-List Mode, Length, Attributes, LinkType, Target, FullName
              if ((Get-Item -LiteralPath $p -Force).PSIsContainer) {
                Get-ChildItem -LiteralPath $p -Force | Format-Table Mode, Length, Name -AutoSize
              }
            } else {
              Write-Host "(not present)"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Package Windows artifacts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\package_windows_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.attach_to_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.attach_to_release || github.ref_name }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          fail_on_unmatched_files: true
